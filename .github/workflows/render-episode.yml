name: Render Episode (Remotion)

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition
        required: true
        type: choice
        options: [Short, Long, Short16x9]
        default: Short
      preview:
        description: Preview only (first 8 seconds)
        required: true
        type: boolean
        default: true
      regenerate_audio:
        description: Regenerate voice + sound with Kokoro (otherwise use committed WAV)
        required: true
        type: boolean
        default: false
  push:
    branches: [v4]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      COMP: ${{ inputs.composition || 'Short' }}
      PREVIEW: ${{ github.event_name == 'workflow_dispatch' && !inputs.preview && 'false' || 'true' }}
      REGEN: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_audio && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System packages (ffmpeg + Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64
      - name: Install dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Regenerate voice + sound (optional)
        if: env.REGEN == 'true'
        run: |
          EP=ep1; [ "$COMP" = "Long" ] && EP=ep1long
          VOICE=$(python3 -c "import json;print(json.load(open('episodes/$EP/timing.json'))['voice'])")
          SPEED=$(python3 -c "import json;print(json.load(open('episodes/$EP/timing.json'))['speed'])")
          node scripts/voice.mjs $EP $VOICE $SPEED
          node scripts/sound.mjs $EP
      - name: Render MP4
        shell: bash
        run: |
          mkdir -p out
          FR=""; [ "$PREVIEW" = "true" ] && FR="--frames=0-239"
          NAME="${COMP}$([ "$PREVIEW" = "true" ] && echo _preview).mp4"
          echo "OUT_FILE=out/$NAME" >> "$GITHUB_ENV"
          npx remotion render src/index.ts "$COMP" "out/$NAME" --codec=h264 --crf=18 --gl=swangle --concurrency=2 $FR 2>&1 | tee render.log
      - name: Show render log tail on failure
        if: failure()
        shell: bash
        run: |
          TAIL=$(tail -n 80 render.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=render-log-tail::${TAIL}"
      - name: QA check
        run: |
          MODE=shorts; [ "$COMP" = "Long" ] || [ "$COMP" = "Short16x9" ] && MODE=long
          if [ "$PREVIEW" = "true" ]; then EXP=8.0; else EXP=$(python3 tools/expected_duration.py "$COMP"); fi
          python3 tools/qa.py "$OUT_FILE" --mode "$MODE" --expect-duration "$EXP" --require-audio
      - name: Contact sheet (12 frames) to previews branch
        continue-on-error: true
        run: |
          ffmpeg -v error -y -i "$OUT_FILE" -vf "fps=1.5,scale=360:-1,tile=6x2" -frames:v 1 out/contact.jpg
          D=$(mktemp -d); cp out/contact.jpg "$D/${COMP}.jpg"; cd "$D"
          git init -q; git checkout -q -b previews; git add .
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -qm "preview ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ env.COMP }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 7
