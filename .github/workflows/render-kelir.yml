name: Render Kelir (2D siluet, voice Indonesia)

on:
  workflow_dispatch:
    inputs:
      format:
        description: "short = 9:16 (1080x1920), long = 16:9 (1920x1080)"
        required: true
        type: choice
        options: [short, long]
        default: short
      preview:
        description: Preview only (first 10 seconds)
        required: true
        type: boolean
        default: true
      save_assets:
        description: Simpan voice.wav, mix.wav, timing.json hasil CI ke branch ini
        required: true
        type: boolean
        default: false
  push:
    branches: [v4]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORMAT: ${{ inputs.format == 'long' && 'long' || 'short' }}
      EP: ${{ inputs.format == 'long' && 'kelirlong1' || 'kelir1' }}
      COMP: ${{ inputs.format == 'long' && 'KelirLong' || 'Kelir' }}
      SHOTCOMP: ${{ inputs.format == 'long' && 'KelirLongShot' || 'KelirShot' }}
      MODE: ${{ inputs.format == 'long' && 'long' || 'shorts' }}
      PREVIEW: ${{ github.event_name == 'workflow_dispatch' && !inputs.preview && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (ffmpeg + Chrome libs)
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64
      - name: TTS engines (edge-tts, espeak-ng fallback)
        timeout-minutes: 5
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install -y --no-install-recommends espeak-ng-data libespeak-ng1 espeak-ng
      - name: Install dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip
      - name: Voice-over + timing + mix
        run: python3 scripts/kelir_voice.py "$EP"
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Stills per shot
        run: |
          node scripts/kelir_stills.mjs "$EP" "$SHOTCOMP" 45
          if [ "$FORMAT" = "long" ]; then TILE="scale=320:-1,tile=4x6"; else TILE="scale=270:-1,tile=4x2"; fi
          ffmpeg -v error -y -i out/stills/%d.png -vf "$TILE" -frames:v 1 "out/shots_${EP}.jpg"
      - name: Render MP4
        shell: bash
        run: |
          FR=""; SUF=""
          if [ "$PREVIEW" = "true" ]; then FR="--frames=0-299"; SUF="_preview"; fi
          NAME="${COMP}${SUF}.mp4"
          echo "OUT_FILE=out/$NAME" >> "$GITHUB_ENV"
          npx remotion render src/index.ts "$COMP" "out/$NAME" --codec=h264 --crf=18 --gl=swangle --concurrency=4 $FR 2>&1 | tee render.log
      - name: Show render log tail on failure
        if: failure()
        shell: bash
        run: |
          TAIL=$(tail -n 80 render.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=render-log-tail::${TAIL}"
      - name: QA check
        run: |
          if [ "$PREVIEW" = "true" ]; then EXP=10.0; else EXP=$(python3 tools/expected_duration.py "$COMP"); fi
          python3 tools/qa.py "$OUT_FILE" --mode "$MODE" --expect-duration "$EXP" --require-audio
      - name: Contact sheet + audio report
        if: always()
        continue-on-error: true
        run: |
          if [ "$FORMAT" = "long" ]; then STEP=6; SC=288; else STEP=2.2; SC=216; fi
          [ -f "$OUT_FILE" ] && ffmpeg -v error -y -i "$OUT_FILE" -vf "fps=1/${STEP},scale=${SC}:-1,tile=5x4" -frames:v 1 "out/contact_${EP}.jpg" || true
          [ -f "$OUT_FILE" ] && ffmpeg -v info -i "$OUT_FILE" -af ebur128=peak=true -vn -f null - 2>&1 | grep -A8 Summary | grep -E "I:|LRA:|Peak:" > "out/loudness_${EP}.txt" || true
          cp "episodes/$EP/timing.json" "out/timing_${EP}.json"
          D=$(mktemp -d); cp -f out/*.jpg out/loudness_*.txt out/timing_*.json "$D"/ 2>/dev/null || true; cd "$D"
          git init -q; git checkout -q -b previews; git add .
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -qm "kelir preview ${EP} ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews
      - name: Publish MP4 as GitHub Release (full render only)
        if: env.PREVIEW == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${EP}-run${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$OUT_FILE" "out/timing_${EP}.json" \
            --title "Kelir ${EP} (${FORMAT}) - run ${GITHUB_RUN_NUMBER}" \
            --notes "Render penuh Kelir ${FORMAT}. Commit ${GITHUB_SHA}. QA otomatis lulus." \
            --target "${GITHUB_SHA}"
      - name: Save generated assets to branch
        if: github.event_name == 'workflow_dispatch' && inputs.save_assets
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -f "public/$EP/voice.wav" "public/$EP/mix.wav" "episodes/$EP/timing.json"
          git commit -m "kelir: simpan voice.wav, mix.wav, timing.json ($EP) hasil CI [skip ci]" || echo "tidak ada perubahan"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: kelir-${{ env.FORMAT }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 7
