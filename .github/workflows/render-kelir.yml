name: Render Kelir (2D siluet, voice Indonesia)

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Preview only (first 10 seconds)
        required: true
        type: boolean
        default: true
  push:
    branches: [v4]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PREVIEW: ${{ github.event_name == 'workflow_dispatch' && !inputs.preview && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (ffmpeg + Chrome libs)
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64
      - name: TTS engines (edge-tts, espeak-ng fallback)
        timeout-minutes: 5
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          python -m pip install edge-tts
          sudo apt-get install -y --no-install-recommends espeak-ng-data libespeak-ng1 espeak-ng
      - name: Install dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip
      - name: Voice-over + timing + mix
        run: python3 scripts/kelir_voice.py kelir1
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Stills per shot
        run: |
          node scripts/kelir_stills.mjs 45
          ffmpeg -v error -y -i out/stills/%d.png -vf "scale=270:-1,tile=4x2" -frames:v 1 out/shots.jpg
      - name: Render MP4
        shell: bash
        run: |
          FR=""; SUF=""
          if [ "$PREVIEW" = "true" ]; then FR="--frames=0-299"; SUF="_preview"; fi
          NAME="Kelir${SUF}.mp4"
          echo "OUT_FILE=out/$NAME" >> "$GITHUB_ENV"
          npx remotion render src/index.ts Kelir "out/$NAME" --codec=h264 --crf=18 --gl=swangle --concurrency=4 $FR 2>&1 | tee render.log
      - name: Show render log tail on failure
        if: failure()
        shell: bash
        run: |
          TAIL=$(tail -n 80 render.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=render-log-tail::${TAIL}"
      - name: QA check
        run: |
          if [ "$PREVIEW" = "true" ]; then EXP=10.0; else EXP=$(python3 tools/expected_duration.py Kelir); fi
          python3 tools/qa.py "$OUT_FILE" --mode shorts --expect-duration "$EXP" --require-audio
      - name: Contact sheet + audio report
        if: always()
        continue-on-error: true
        run: |
          [ -f "$OUT_FILE" ] && ffmpeg -v error -y -i "$OUT_FILE" -vf "fps=1/2.2,scale=216:-1,tile=5x4" -frames:v 1 out/contact.jpg || true
          [ -f "$OUT_FILE" ] && ffmpeg -v info -i "$OUT_FILE" -af ebur128=peak=true -vn -f null - 2>&1 | grep -A8 Summary | grep -E "I:|LRA:|Peak:" > out/loudness.txt || true
          cp episodes/kelir1/timing.json out/timing.json
          D=$(mktemp -d); cp -f out/*.jpg out/loudness.txt out/timing.json "$D"/ 2>/dev/null || true; cd "$D"
          git init -q; git checkout -q -b previews; git add .
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -qm "kelir preview ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: kelir-video
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 7
