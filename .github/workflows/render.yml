name: Render Cartoon Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Video mode
        required: true
        type: choice
        options: [shorts, long]
        default: shorts
      duration:
        description: Duration in seconds
        required: true
        default: "10"
      preview:
        description: Preview (max 10s) before full render
        required: true
        type: boolean
        default: true
      output_name:
        description: MP4 filename
        required: true
        default: cartoon-video.mp4
  push:
    branches: [v4]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      VIDEO_MODE: ${{ inputs.mode || 'shorts' }}
      VIDEO_DURATION: ${{ inputs.duration || '3' }}
      PREVIEW: ${{ inputs.preview == false && 'false' || 'true' }}
      OUTPUT_NAME: ${{ inputs.output_name || 'cartoon-video.mp4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render MP4
        run: npm run render
      - name: QA check
        run: python3 tools/qa.py "out/${OUTPUT_NAME}" --mode "${VIDEO_MODE}"
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-video-${{ env.VIDEO_MODE }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 7
